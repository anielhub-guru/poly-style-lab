<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AikiScene 3D viewer</title>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #111418; color: #e8eaed; font: 13px system-ui, sans-serif; }
  #stage { position: absolute; inset: 0 0 48px 0; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; gap: 12px; align-items: center; padding: 0 16px; background: #1b1f26; }
  button, input[type=file]::file-selector-button { background: #2b313b; color: inherit; border: 1px solid #3b4350; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed=true] { background: #3d6df2; border-color: #3d6df2; }
  #status { margin-left: auto; opacity: .7; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <input id="file" type="file" accept=".aikiscene,application/json">
  <button data-mode="sway" aria-pressed="true">Sway</button>
  <button data-mode="orbit" aria-pressed="false">Orbit</button>
  <button data-mode="reference" aria-pressed="false">Reference</button>
  <label>Depth <input id="depth" type="range" min="0.3" max="3" step="0.1" value="1"></label>
  <span id="status">Open an .aikiscene or use ?scene=/workspaces/&lt;id&gt;/reconstruction/scene.aikiscene</span>
</div>
<script type="module">
  import { createAikiSceneViewer } from '/src/viewer3d.js';
  const stage = document.getElementById('stage'), status = document.getElementById('status');
  let viewer = null, mode = new URLSearchParams(location.search).get('mode') || 'sway';
  document.querySelectorAll('[data-mode]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.mode === mode)));
  async function show(scene) {
    viewer?.dispose();
    status.textContent = 'Building…';
    viewer = await createAikiSceneViewer(stage, scene, { mode });
    window.__viewer = viewer;
    const cam = new URLSearchParams(location.search).get('cam');
    if (cam) { viewer.setMode('orbit'); viewer.renderOnce(cam.split(',').map(Number)); }
    status.textContent = `${scene.layers.length} layers · ${scene.primitives.length} primitives · depth from ${scene.world?.method}`;
  }
  const scene = new URLSearchParams(location.search).get('scene');
  if (scene) show(await (await fetch(scene)).json()).catch(error => { status.textContent = error.message; });
  document.getElementById('file').addEventListener('change', async event => {
    const file = event.target.files[0]; if (!file) return;
    try { await show(JSON.parse(await file.text())); } catch (error) { status.textContent = error.message; }
  });
  for (const button of document.querySelectorAll('[data-mode]')) button.addEventListener('click', () => {
    mode = button.dataset.mode; viewer?.setMode(mode);
    document.querySelectorAll('[data-mode]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
  });
  document.getElementById('depth').addEventListener('input', event => viewer?.setThickness(Number(event.target.value)));
</script>
</body>
</html>
